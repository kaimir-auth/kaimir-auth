name: Update Weekly Activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate weekly SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_WEEKLY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_weekly.py --username kaimir-auth --output dist/weekly.svg

      - name: Publish to weekly-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-to-branch.sh weekly-output dist "Update weekly GitHub activity"
