<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">About K</title>
  <desc id="desc">Terminal-style animated about section for K, using only SVG SMIL and CSS animation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset="1" stop-color="#0f1724"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="typing"><rect x="72" y="160" width="0" height="38"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;900;900;0" keyTimes="0;0.20;0.45;1"/></rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .bright { fill: #e7eef8; }
      .muted { fill: #7e8ba0; }
      .accent { fill: #7dd3fc; }
      .green { fill: #86efac; }
      .row { opacity: 0; animation: reveal 12s ease-in-out infinite; }
      .r1 { animation-delay: 2.4s; }
      .r2 { animation-delay: 3.6s; }
      .r3 { animation-delay: 4.8s; }
      .r4 { animation-delay: 6.0s; }
      @keyframes reveal { 0%, 15%, 100% { opacity: 0; } 22%, 82% { opacity: 1; } }
      .cursor { animation: blink 0.9s steps(1, end) infinite; }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="520" rx="22" fill="url(#bg)" stroke="#263142" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="58" rx="22" fill="#111827"/>
  <rect x="20" y="56" width="1160" height="22" fill="#111827"/>
  <circle cx="58" cy="49" r="7" fill="#ef4444"/>
  <circle cx="82" cy="49" r="7" fill="#f59e0b"/>
  <circle cx="106" cy="49" r="7" fill="#22c55e"/>
  <text x="138" y="55" class="mono muted" font-size="18">k@systems: ~/about</text>

  <text x="72" y="122" class="mono accent" font-size="25">~/about</text>
  <text x="72" y="164" class="mono soft" font-size="22">$ whoami</text>
  <text x="72" y="194" class="mono bright" font-size="24" clip-path="url(#typing)">K — self-driven AI Integration &amp; Systems Architect</text>

  <g class="row r1">
    <text x="72" y="252" class="mono green" font-size="20">→</text>
    <text x="103" y="252" class="mono bright" font-size="20">T-shaped direction: broad interdisciplinary knowledge + deep backend focus</text>
  </g>
  <g class="row r2">
    <text x="72" y="318" class="mono green" font-size="20">→</text>
    <text x="103" y="318" class="mono bright" font-size="20">Interests: AI · cognitive science &amp; psychology · linguistics · philosophy · writing</text>
  </g>
  <g class="row r3">
    <text x="72" y="384" class="mono green" font-size="20">→</text>
    <text x="103" y="384" class="mono bright" font-size="20">Direction: AI / Solutions Engineering · product building · freelancing</text>
  </g>
  <g class="row r4">
    <text x="72" y="450" class="mono green" font-size="20">→</text>
    <text x="103" y="450" class="mono bright" font-size="20">Learning honestly: moving from AI-assisted builds toward writing more code myself</text>
  </g>

  <text x="72" y="505" class="mono muted" font-size="18">$ echo "curious, confident, still learning"</text>
  <rect x="655" y="483" width="12" height="27" rx="2" fill="#7dd3fc" class="cursor"/>
</svg>
