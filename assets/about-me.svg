<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">About K</title>
  <desc id="desc">Dark terminal-style about section with a static fallback and a SMIL/CSS reveal layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0F"/>
      <stop offset="1" stop-color="#0F1724"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .bright{fill:#E7EEF8}.muted{fill:#7E8BA0}.accent{fill:#7DD3FC}.green{fill:#86EFAC}.soft{fill:#A8B3C2}
      .animated{opacity:0;animation:reveal 12s ease-in-out infinite}
      .r1{animation-delay:2.2s}.r2{animation-delay:3.2s}.r3{animation-delay:4.2s}.r4{animation-delay:5.2s}
      @keyframes reveal{0%,17%,100%{opacity:0}22%,82%{opacity:1}}
      .cursor{animation:blink .9s steps(1,end) infinite}
      @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
    </style>
  </defs>
  <rect x="20" y="20" width="1160" height="520" rx="22" fill="url(#bg)" stroke="#263142" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="58" rx="22" fill="#111827"/>
  <rect x="20" y="56" width="1160" height="22" fill="#111827"/>
  <circle cx="58" cy="49" r="7" fill="#EF4444"/>
  <circle cx="82" cy="49" r="7" fill="#F59E0B"/>
  <circle cx="106" cy="49" r="7" fill="#22C55E"/>
  <text x="138" y="55" class="mono muted" font-size="18">k@systems: ~/about</text>
  <text x="72" y="122" class="mono accent" font-size="25">~/about</text>
  <text x="72" y="164" class="mono soft" font-size="22">$ whoami</text>

  <!-- Static fallback. -->
  <g aria-label="static fallback">
    <text x="72" y="204" class="mono bright" font-size="24">K — self-driven AI Integration &amp; Systems Architect</text>
    <text x="72" y="262" class="mono green" font-size="20">→</text>
    <text x="103" y="262" class="mono bright" font-size="20">T-shaped direction: broad interdisciplinary knowledge + deep backend focus</text>
    <text x="72" y="328" class="mono green" font-size="20">→</text>
    <text x="103" y="328" class="mono bright" font-size="20">Interests: AI · cognitive science &amp; psychology · linguistics · philosophy · writing</text>
    <text x="72" y="394" class="mono green" font-size="20">→</text>
    <text x="103" y="394" class="mono bright" font-size="20">Direction: AI / Solutions Engineering · product building · freelancing</text>
    <text x="72" y="460" class="mono green" font-size="20">→</text>
    <text x="103" y="460" class="mono bright" font-size="20">Learning honestly: moving from AI-assisted builds toward writing more code myself</text>
  </g>

  <!-- Optional animated reveal layer. -->
  <g class="animated" aria-hidden="true">
    <text x="72" y="204" class="mono bright" font-size="24">K — self-driven AI Integration &amp; Systems Architect</text>
  </g>
  <g class="animated r1" aria-hidden="true"><text x="72" y="262" class="mono green" font-size="20">→</text><text x="103" y="262" class="mono bright" font-size="20">T-shaped direction: broad interdisciplinary knowledge + deep backend focus</text></g>
  <g class="animated r2" aria-hidden="true"><text x="72" y="328" class="mono green" font-size="20">→</text><text x="103" y="328" class="mono bright" font-size="20">Interests: AI · cognitive science &amp; psychology · linguistics · philosophy · writing</text></g>
  <g class="animated r3" aria-hidden="true"><text x="72" y="394" class="mono green" font-size="20">→</text><text x="103" y="394" class="mono bright" font-size="20">Direction: AI / Solutions Engineering · product building · freelancing</text></g>
  <g class="animated r4" aria-hidden="true"><text x="72" y="460" class="mono green" font-size="20">→</text><text x="103" y="460" class="mono bright" font-size="20">Learning honestly: moving from AI-assisted builds toward writing more code myself</text></g>

  <text x="72" y="505" class="mono muted" font-size="18">$ echo "curious, confident, still learning"</text>
  <rect x="655" y="483" width="12" height="27" rx="2" fill="#7DD3FC" class="cursor"/>
</svg>
